name: Nightly Quality

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_INCREMENTAL: 0

jobs:
  nightly-fuzz-and-audit:
    name: nightly-fuzz-and-audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2
        with:
          key: nightly-quality

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libgtk-3-dev \
            libblkid-dev \
            liblzma-dev \
            pkg-config

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: fuzz registry consistency
        run: python3 tests/scripts/check_fuzz_registry.py

      - name: corpus replay
        run: python3 tests/scripts/replay_fuzz_corpus.py

      - name: cargo test (integration tests)
        run: cargo test --test integration

      - name: cargo test (simulation tests)
        run: cargo test --test simulation

      # This is intentionally longer than the per-PR 30-second smoke gate, but
      # still bounded for GitHub-hosted runners. Full 24-hour or self-hosted
      # campaigns are still tracked separately in the spec and local audits.
      - name: extended fuzz — active targets (600s each)
        run: |
          python3 - <<'PY' > /tmp/mesh_infinity_active_fuzz_targets.txt
          import tomllib
          from pathlib import Path

          registry = tomllib.loads(Path("fuzz/targets.toml").read_text(encoding="utf-8"))
          for entry in registry["target"]:
              if entry["status"] == "active":
                  print(entry["name"])
          PY

          while IFS= read -r target; do
            echo "Running nightly fuzz target: ${target}"
            cargo +nightly fuzz run "${target}" -- -max_total_time=600
          done < /tmp/mesh_infinity_active_fuzz_targets.txt

      - name: RustSec gate
        run: python3 scripts/security/rustsec_gate.py

  # ── Coverage (cargo-llvm-cov) ─────────────────────────────────────────────
  #
  # Produces an LCOV report for the whole workspace and uploads it as a
  # retention-30-day artifact.  A downloaded lcov.info can be ingested by
  # lcov/genhtml locally or piped into codecov/coveralls.
  #
  # Requires: llvm-tools-preview component (installed below via dtolnay/rust-toolchain).

  coverage:
    name: coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Stable toolchain with the LLVM tools component that llvm-cov needs.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          key: nightly-coverage

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libgtk-3-dev \
            libblkid-dev \
            liblzma-dev \
            pkg-config

      # cargo-llvm-cov instruments the binary with LLVM coverage and merges
      # per-function counters into a single LCOV file.
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      # --workspace includes every crate under the Cargo workspace.
      # --lcov writes the widely-supported LCOV text format.
      # --output-path places the report at a known path for the upload step.
      - name: Generate LCOV coverage report
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info

      # Retain the report for 30 days so developers can download it after a
      # nightly run without re-running the full CI job.
      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v4
        with:
          name: lcov-report-${{ github.run_id }}
          path: lcov.info
          retention-days: 30

  # ── Miri (undefined-behaviour detection) ─────────────────────────────────
  #
  # Miri runs Rust code in an interpreter that detects UB: use-after-free,
  # out-of-bounds memory access, data races on raw pointers, etc.
  #
  # Scope: backend/crypto (all encryption / key-derivation paths) and
  # backend/storage/vault (on-disk vault serialisation / AES-GCM paths).
  #
  # -Zmiri-disable-isolation is required for tests that call
  # std::fs / getrandom (vault reload, random salt generation).

  miri:
    name: miri
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Miri only ships on nightly.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - uses: Swatinem/rust-cache@v2
        with:
          key: nightly-miri

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libgtk-3-dev \
            libblkid-dev \
            liblzma-dev \
            pkg-config

      # Pre-build the Miri sysroot so the first test run is not delayed by it.
      - name: Set up Miri sysroot
        run: cargo miri setup

      # Run all unit tests inside the crypto module.
      # -Zmiri-disable-isolation lets getrandom / OsRng work inside Miri.
      - name: Miri — backend/crypto unit tests
        env:
          MIRIFLAGS: "-Zmiri-disable-isolation"
        run: cargo miri test --lib -- crypto

      # Run all unit tests inside the storage/vault module.
      # Vault uses argon2 (CPU-intensive) so this step may be slow; it is
      # bounded by the runner's time limit rather than a per-step timeout.
      - name: Miri — backend/storage/vault unit tests
        env:
          MIRIFLAGS: "-Zmiri-disable-isolation"
        run: cargo miri test --lib -- vault

  # ── Loom (concurrency model-checking) ────────────────────────────────────
  #
  # Loom exhaustively explores thread interleavings for code compiled with
  # `--cfg loom`.  Tests that use `loom::sync::Arc`, `loom::thread::spawn`,
  # etc. are gated by `#[cfg(loom)]` and skipped in normal builds.
  #
  # Currently this job establishes the CI infrastructure so loom-annotated
  # tests can be added incrementally to runtime.rs and service/ without
  # requiring a workflow change.  The job succeeds cleanly when 0 loom tests
  # are present and will catch new concurrency bugs as tests are added.

  loom:
    name: loom
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Loom requires nightly for some of its internal atomic intrinsics.
      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2
        with:
          key: nightly-loom

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libgtk-3-dev \
            libblkid-dev \
            liblzma-dev \
            pkg-config

      # Compile and run tests with the `loom` cfg flag active.
      # Tests not gated by `#[cfg(loom)]` are compiled out, so this run
      # covers only the explicitly annotated concurrency tests.
      # The filter `-- runtime` scopes model-checking to the service runtime;
      # expand the filter as loom tests are added to other modules.
      - name: Loom — service runtime concurrency tests
        env:
          RUSTFLAGS: "--cfg loom"
        run: cargo test --lib -- runtime
