# =============================================================================
# fuzz/Cargo.toml — cargo-fuzz manifest for Mesh Infinity fuzz targets.
#
# What is cargo-fuzz?
# -------------------
# cargo-fuzz is a tool that integrates libFuzzer (part of LLVM) with Rust.
# libFuzzer is a coverage-guided fuzzing engine: it mutates inputs based on
# which code branches have been hit, steering mutations toward unexplored
# paths.  Every fuzz target is a small binary that calls one harness function
# with the fuzz-generated input.
#
# This workspace is kept separate from the main Mesh Infinity workspace so
# that fuzz binaries (which require nightly Rust and special sanitizer flags)
# never pollute the production build.
#
# Usage:
#   cargo +nightly fuzz run fuzz_nfc_ndef
#   cargo +nightly fuzz run fuzz_pairing_payload -- -max_total_time=30
#   cargo +nightly fuzz run fuzz_message_frame   -- -max_total_time=60
# =============================================================================

[package]
name = "mesh-infinity-fuzz"
version = "0.0.1"
edition = "2021"
# Fuzz binaries are not published to crates.io.
publish = false

# cargo-fuzz checks for this metadata flag when the manifest name/path does not
# match its implicit expectations. Setting it explicitly makes CI and local
# invocation treat this manifest as the fuzz workspace unambiguously.
[package.metadata]
cargo-fuzz = true

# libfuzzer-sys provides the Rust binding to libFuzzer.
# It exports the `fuzz_target!` macro that wraps our harness function as the
# libFuzzer entry point (the `LLVMFuzzerTestOneInput` C symbol).
[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1.0"
ed25519-dalek = "2.0"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
rand_chacha = "0.9"
rand_core = "0.6"

# The main Mesh Infinity crate — provides all parsers under test.
# `path` points to the workspace root from the fuzz/ subdirectory.
mesh-infinity = { path = "..", features = ["fuzzing"] }

# cargo-fuzz requires fuzz crates to declare themselves as their own workspace
# so that Cargo does not try to inherit settings from the parent workspace.
# Without this, cargo-fuzz fails because the parent Cargo.toml's crate-type
# list (cdylib, staticlib, rlib) conflicts with fuzz binary compilation.
[workspace]

# =============================================================================
# Fuzz target binaries
#
# Each [[bin]] entry corresponds to one fuzz target.  The `name` field must
# match the filename in fuzz_targets/ (without the .rs extension).
# =============================================================================

# --- Target 1: NFC NDEF record parsing (§5.9) --------------------------------
#
# Feeds arbitrary bytes into the NFC NDEF parser that Mesh Infinity uses to
# read pairing records from NFC tags.  Any malformed tag data a hostile device
# broadcasts must be gracefully rejected — never panic.
[[bin]]
name = "fuzz_nfc_ndef"
path = "fuzz_targets/fuzz_nfc_ndef.rs"

# --- Target 2: Pairing payload deserialization (§8.3) ------------------------
#
# Feeds arbitrary bytes as a candidate JSON pairing payload.  The pairing
# subsystem is the first point of contact with an unknown peer; it must
# handle arbitrarily malformed JSON without crashing.
[[bin]]
name = "fuzz_pairing_payload"
path = "fuzz_targets/fuzz_pairing_payload.rs"

# --- Target 3: Mesh message frame deserialization (§6.5) ---------------------
#
# Feeds arbitrary bytes into the MeshPacket JSON deserializer.  Intermediate
# relay nodes process packets from peers they may not trust; the framing layer
# must never panic regardless of what bytes arrive over the wire.
[[bin]]
name = "fuzz_message_frame"
path = "fuzz_targets/fuzz_message_frame.rs"

# --- Target 4: Four-layer message decryption (§7.2) --------------------------
#
# Builds a valid encrypted message, then mutates ciphertext, sender identity,
# recipient identity, session keys, nonce, ratchet key, and context before
# calling `decrypt_message()`. This gives the decrypt boundary both successful
# and adversarial inputs instead of only random early-failure bytes.
[[bin]]
name = "fuzz_decrypt_message"
path = "fuzz_targets/fuzz_decrypt_message.rs"

# --- Target 5: Reachability announcement parse/process (§6.2) ---------------
#
# Exercises both the JSON byte boundary for `ReachabilityAnnouncement` and the
# semantic validation path in `AnnouncementProcessor::process()`. The harness
# feeds arbitrary JSON plus mutated valid announcements so replay, age, hop,
# and signature invariants stay fuzzed as the routing layer evolves.
[[bin]]
name = "fuzz_parse_routing_announcement"
path = "fuzz_targets/fuzz_parse_routing_announcement.rs"

# --- Target 6: Pairing QR/deep-link payload parser (§8.3) -------------------
#
# Exercises the real hostile-byte boundary for scanned pairing payloads:
# JSON decode, hex decoding, and semantic validation before service-layer use.
[[bin]]
name = "fuzz_parse_pairing_qr"
path = "fuzz_targets/fuzz_parse_pairing_qr.rs"

# --- Target 7: Vault file decode boundary (§17.9) ---------------------------
#
# Exercises the persisted `.vault` blob parser directly: schema header, nonce,
# AEAD ciphertext, and JSON decode. The harness mutates valid encrypted blobs
# so both authenticated corruption and structural parse errors are covered.
[[bin]]
name = "fuzz_vault_load"
path = "fuzz_targets/fuzz_vault_load.rs"

# --- Target 8: Identity payload decode boundary (§3.6.2) -------------------
#
# Exercises `SelfIdentity::from_payload()`, the direct parser for decrypted
# identity payload bytes prior to master-key reinjection and KEM derivation.
[[bin]]
name = "fuzz_identity_payload"
path = "fuzz_targets/fuzz_identity_payload.rs"

# --- Target 9: FFI JSON payload boundaries (§17.5) -------------------------
#
# Exercises representative JSON strings passed through the C ABI into
# service-layer setters. The harness keeps payloads bounded and invokes
# side-effect-light handlers so malformed UI/platform JSON cannot panic or
# corrupt shared state.
[[bin]]
name = "fuzz_ffi_json_inputs"
path = "fuzz_targets/fuzz_ffi_json_inputs.rs"

# --- Target 10: KCP segment input parser (§5.31) ---------------------------
#
# Exercises `KcpState::input()` with arbitrary bytes. KCP segments arrive from
# peers inside the transport layer, so malformed headers, lengths, command
# values, and fragments must be dropped without panics or state corruption.
[[bin]]
name = "fuzz_kcp_packet"
path = "fuzz_targets/fuzz_kcp_packet.rs"

# --- Target 11: Stateful network simulator actions (§21.2.6) --------------
#
# Decodes arbitrary bytes into bounded multi-node simulator actions and checks
# invariants after every action. This keeps topology changes, partitions,
# restart/reload-style transitions, kill-switch behavior, and transport
# toggling under coverage-guided fuzz pressure.
[[bin]]
name = "fuzz_network_sim_actions"
path = "fuzz_targets/fuzz_network_sim_actions.rs"

# Gossip map entry (§4.1, §4.2) — drives insert_gossiped() with attacker bytes.
[[bin]]
name = "fuzz_gossip_entry"
path = "fuzz_targets/fuzz_gossip_entry.rs"

# Complete native Sphinx receive path (§11.3) — attacker-controlled fixed-size wire frames.
[[bin]]
name = "fuzz_sphinx_packet"
path = "fuzz_targets/fuzz_sphinx_packet.rs"

# Store-and-forward deposit/retrieve/gc (§13) — attacker-controlled payloads and sigs.
[[bin]]
name = "fuzz_store_forward"
path = "fuzz_targets/fuzz_store_forward.rs"

# --- Target 14: Encrypted offline bundle decode (§5.28) -------------------
#
# Drives OfflineBundle::open_as_recipient() with arbitrary bytes to ensure
# that AEAD failures, bad magic, truncation, and corrupt lengths all return
# Err without panicking.
[[bin]]
name = "fuzz_offline_bundle_decode"
path = "fuzz_targets/fuzz_offline_bundle_decode.rs"

# --- Target 15: Backup envelope header validation (§3.7.4) -----------------
#
# Parses arbitrary bytes as an EncryptedBackup envelope and runs the
# pre-KDF structural gate (version, type, Argon2id floor/ceiling, salt and
# nonce lengths). A tampered header must never panic or reach the KDF.
[[bin]]
name = "fuzz_backup_restore"
path = "fuzz_targets/fuzz_backup_restore.rs"

[[bin]]
name = "fuzz_ring_verify"
path = "fuzz_targets/fuzz_ring_verify.rs"
