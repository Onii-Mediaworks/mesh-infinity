# fuzz/targets.toml — required fuzz target registry for Mesh Infinity.
#
# This file is the machine-readable source of truth for fuzz-target coverage.
# Every active cargo-fuzz target must appear here, and every spec-required
# external-byte boundary that is not yet fuzzed must be tracked explicitly.
#
# Valid status values:
#   - active
#   - blocked-unimplemented
#   - blocked-design-pending
#   - not-applicable

[[target]]
name = "fuzz_nfc_ndef"
status = "active"
owner_module = "backend/transport/nfc.rs"
threat = "malformed NFC NDEF pairing record bytes"
required_by_spec = true

[[target]]
name = "fuzz_pairing_payload"
status = "active"
owner_module = "backend/pairing/methods.rs"
threat = "malformed peer pairing payload JSON"
required_by_spec = true

[[target]]
name = "fuzz_message_frame"
status = "active"
owner_module = "backend/mesh/packet.rs"
threat = "malformed outer mesh packet frame bytes"
required_by_spec = true

[[target]]
name = "fuzz_decrypt_message"
status = "active"
owner_module = "backend/crypto/message_encrypt.rs"
threat = "malformed ciphertext, nonce, or tag causing panic or false-positive decrypt"
required_by_spec = true

[[target]]
name = "fuzz_parse_routing_announcement"
status = "active"
owner_module = "backend/routing/announcement.rs"
threat = "malformed routing announcement bytes causing panic, replay acceptance, or trust mutation"
required_by_spec = true

[[target]]
name = "fuzz_parse_pairing_qr"
status = "active"
owner_module = "backend/pairing/methods.rs"
threat = "malformed pairing QR payload bytes before semantic pairing use"
required_by_spec = true

[[target]]
name = "fuzz_vault_load"
status = "active"
owner_module = "backend/storage/vault.rs"
threat = "malformed vault file bytes causing panic, silent corruption, or auth bypass"
required_by_spec = true

[[target]]
name = "fuzz_identity_payload"
status = "active"
owner_module = "backend/identity/self_identity.rs"
threat = "malformed identity payload bytes causing panic, key confusion, or partial-load state mutation"
required_by_spec = true

[[target]]
name = "fuzz_ffi_json_inputs"
status = "active"
owner_module = "backend/ffi/lib.rs"
threat = "malformed FFI JSON causing panic, trust mutation, or diagnostic/privacy violations"
required_by_spec = true

[[target]]
name = "fuzz_kcp_packet"
status = "active"
owner_module = "backend/transport/kcp.rs"
threat = "malformed KCP segment bytes causing panic, replay confusion, or state corruption"
required_by_spec = true

[[target]]
name = "fuzz_network_sim_actions"
status = "active"
owner_module = "backend/testing/sim.rs"
threat = "arbitrary multi-node action sequences violating routing, trust, identity, or kill-switch invariants"
required_by_spec = true

[[target]]
name = "fuzz_gossip_entry"
status = "active"
owner_module = "backend/network/map.rs"
threat = "malformed gossip entry bytes causing panic, Sybil promotion, or endpoint injection via insert_gossiped()"
required_by_spec = true

[[target]]
name = "fuzz_sphinx_packet"
status = "active"
owner_module = "backend/transport/mixnet.rs"
threat = "malformed native mixnet frames causing panic, replay-state mutation, or unauthenticated Sphinx delivery"
required_by_spec = true

[[target]]
name = "fuzz_store_forward"
status = "active"
owner_module = "backend/routing/store_forward.rs"
threat = "malformed S&F deposit payloads, invalid expiry signatures, or overflow in storage cap logic"
required_by_spec = true


[[target]]
name = "fuzz_offline_bundle_decode"
status = "active"
owner_module = "backend/transport/offline_bundle.rs"
threat = "malformed encrypted offline bundles causing panic, unauthenticated plaintext release, or partial decode"
required_by_spec = true

[[target]]
name = "fuzz_backup_restore"
status = "active"
owner_module = "backend/crypto/backup.rs"
threat = "tampered backup envelope header driving oversized Argon2id parameters (allocation abort / CPU exhaustion) or panicking the parser before restore"
required_by_spec = true
